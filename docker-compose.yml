services:
  # ============================================================
  # 1. PostgreSQL Database Service
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: invento_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-invento_retail_new}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Root@123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Note: Host ports are not exposed to avoid collisions with host PostgreSQL services (5432/5433).
    # The backend container connects internally via 'postgres:5432' over the private Docker network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-invento_retail_new}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - invento_backend_net

  # ============================================================
  # 2. INVENTO ERP Express Backend API
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invento_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-invento_retail_new}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-Root@123}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-pratapsons_secure_production_jwt_key_2026}
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 2000
      BCRYPT_SALT_ROUNDS: 10
      ANT_BASE: ${ANT_BASE:-https://apis.accountsntax.com/api/v1}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - invento_backend_net

volumes:
  postgres_data:
    name: invento_postgres_data
  backend_uploads:
    name: invento_backend_uploads

networks:
  invento_backend_net:
    name: invento_backend_net
    driver: bridge
